[package]
name = "chappay"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-session = {version = "0.11.0", features = ["redis-session"]}
actix-identity = "0.9.0"
actix-web-httpauth = "0.8.2"
argon2 = "0.5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
dotenv = "0.15"
tokio = { version = "1", features = ["full"] }
validator = { version = "0.16", features = ["derive"] }
sea-orm = { version = "2.0.0-rc", features = ["sqlx-sqlite", "runtime-tokio", "with-uuid", "with-json"] }
rand_core = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = "9.3"
chrono = "0.4.44"
futures-util = "0.3.32"
log = "0.4.29"
once_cell = "1.21.3"
redis = { version = "1.0.3", features = ["tokio-comp", "connection-manager"] }
